<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Widget</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100%;
    }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        /* Background image lives alongside this file in the repo and is
           always named exactly "Notion Background.webp" (capital N and B,
           space-separated). GitHub Pages is case-sensitive, so this must
           match the stored filename exactly — swap the file, not this rule. */
        background-color: #0f172a;
        background-image: url('Notion%20Background.webp');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: white;
        overflow: hidden;
    }

    /* ================= WIDGET CARD ================= */
    .widget {
        position: relative;
        width: 520px;
        height: 480px;
        max-width: 100%;
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
    }

    #bg-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
    }

    /* Dark glass tint sits above the animated canvas, below the text */
    .glass-tint {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.18);
        pointer-events: none;
    }

    .overlay {
        position: absolute;
        inset: 0;
        padding: 30px;
        display: flex;
        flex-direction: column;
        font-family: inherit;
    }

    /* ---- top row: location text + manual override search ---- */
    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
    }

    .loc-text { line-height: 1.5; }
    .loc-name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.4px;
        color: rgba(255,255,255,0.72);
        text-transform: uppercase;
    }
    .loc-date {
        font-size: 12px;
        color: rgba(255,255,255,0.42);
    }
    .loc-time {
        font-size: 12px;
        font-weight: 500;
        color: rgba(255,255,255,0.42);
    }

    #city-search {
        background: rgba(20,20,30,0.45);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 12.5px;
        color: white;
        outline: none;
        font-family: inherit;
        width: 180px;
        backdrop-filter: blur(6px);
        transition: border-color 0.2s, background 0.2s, width 0.2s;
    }
    #city-search::placeholder { color: rgba(255,255,255,0.4); }
    #city-search:focus {
        border-color: rgba(99,179,237,0.55);
        background: rgba(20,20,30,0.65);
        width: 210px;
    }

    /* ---- main weather block ---- */
    .main-block { margin-top: 34px; }
    .weather-icon {
        font-size: 66px;
        line-height: 1;
        margin-bottom: 14px;
        filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
    }
    .temp {
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -1px;
        line-height: 1;
    }
    .desc {
        margin-top: 14px;
        font-size: 22px;
        font-weight: 500;
        color: rgba(255,255,255,0.92);
    }
    .feels-like {
        margin-top: 4px;
        font-size: 14px;
        color: rgba(255,255,255,0.52);
    }

    /* ---- bottom stats row ---- */
    .stats-row {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.13);
        display: flex;
    }
    .stat {
        flex: 1;
        text-align: center;
        position: relative;
        padding: 4px 0 0;
    }
    .stat:not(:first-child)::before {
        content: '';
        position: absolute;
        left: 0; top: 4px; bottom: 0;
        width: 1px;
        background: rgba(255,255,255,0.10);
    }
    .stat-icon { font-size: 18px; }
    .stat-label {
        margin-top: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: rgba(255,255,255,0.42);
    }
    .stat-value {
        margin-top: 4px;
        font-size: 14px;
        font-weight: 600;
    }

    /* ---- status / loading / error banner ---- */
    #status-banner {
        position: absolute;
        left: 30px;
        right: 30px;
        bottom: 14px;
        font-size: 11.5px;
        text-align: center;
        color: rgba(255,255,255,0.4);
        pointer-events: none;
        display: none;
    }
    #status-banner.visible { display: block; }
    #status-banner.error { color: #f87171; }

    /* Hide the stats/temp block content while nothing has loaded yet,
       so we don't show "--" flickers before the first successful render. */
    .widget.no-data .main-block,
    .widget.no-data .stats-row { visibility: hidden; }
</style>
</head>
<body>

<div class="widget no-data" id="widget">
    <canvas id="bg-canvas"></canvas>
    <div class="glass-tint"></div>

    <div class="overlay">
        <div class="top-row">
            <div class="loc-text">
                <div class="loc-name" id="loc-name">Locating…</div>
                <div class="loc-date" id="loc-date">&nbsp;</div>
                <div class="loc-time" id="loc-time">&nbsp;</div>
            </div>
            <input type="text" id="city-search" placeholder="Enter city…" autocomplete="off" spellcheck="false">
        </div>

        <div class="main-block">
            <div class="weather-icon" id="weather-icon">⛅</div>
            <div class="temp" id="temp">--°</div>
            <div class="desc" id="desc">&nbsp;</div>
            <div class="feels-like" id="feels-like">&nbsp;</div>
        </div>

        <div class="stats-row">
            <div class="stat">
                <div class="stat-icon">💧</div>
                <div class="stat-label">HUMIDITY</div>
                <div class="stat-value" id="stat-humidity">--%</div>
            </div>
            <div class="stat">
                <div class="stat-icon">💨</div>
                <div class="stat-label">WIND</div>
                <div class="stat-value" id="stat-wind">-- km/h</div>
            </div>
            <div class="stat">
                <div class="stat-icon">☀️</div>
                <div class="stat-label">UV INDEX</div>
                <div class="stat-value" id="stat-uv">--</div>
            </div>
        </div>
    </div>

    <div id="status-banner"></div>
</div>

<script src="weather-widget.js"></script>
</body>
</html>
